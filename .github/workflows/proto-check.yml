name: Proto Generation Check

on:
  pull_request:
    branches: [main]
    paths:
      - "api/proto/**/*.proto"
      - "buf.yaml"
      - "buf.gen.yaml"

jobs:
  check-generated:
    name: Check Generated Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install  # version from .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate proto files
        run: buf generate

      - name: Check if generated files are up to date
        run: |
          if ! git diff --exit-code gen/; then
            echo "❌ Generated proto files are out of date!"
            echo "Please run 'buf generate' and commit the changes."
            git diff gen/
            exit 1
          else
            echo "✅ Generated proto files are up to date"
          fi
