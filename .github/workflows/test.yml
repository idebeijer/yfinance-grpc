name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install  # version from .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Run unit tests
        run: uv run pytest -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install  # version from .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Start gRPC server in background
        run: |
          uv run yfinance-grpc &
          echo $! > server.pid
          # Wait until the port accepts connections (max ~30s)
          for _ in $(seq 30); do
            nc -z localhost 50059 && break
            sleep 1
          done

      - name: Check if server is running
        run: |
          if ! ps -p $(cat server.pid) > /dev/null; then
            echo "Server failed to start"
            exit 1
          fi
          echo "Server is running with PID $(cat server.pid)"

      - name: Run integration tests
        run: uv run pytest -m integration -v

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
            rm server.pid
          fi

  python-lint:
    name: Lint and Type-check Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install  # version from .python-version

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  lint:
    name: Lint Proto Files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Buf
        uses: bufbuild/buf-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
