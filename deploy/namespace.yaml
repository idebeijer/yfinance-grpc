apiVersion: v1
kind: Namespace
metadata:
  name: yfinance-grpc
  labels:
    # Reject any pod in this namespace that doesn't meet the "restricted"
    # Pod Security Standard (non-root, no privilege escalation, seccomp, ...).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
