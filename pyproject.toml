[project]
name = "yfinance-grpc"
version = "0.1.0"
description = "gRPC server exposing Yahoo Finance data via the yfinance library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "grpcio==1.85.3",
    "grpcio-reflection==1.85.3",
    "pandas>=3.1",
    "protobuf==7.36.2",
    "yfinance==1.8.0",
]

[project.scripts]
yfinance-grpc = "yfinance_grpc_server.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pandas-stubs>=2.3",
    "pytest>=9.2.0",
    "ruff>=0.14",
    "types-protobuf>=6.32",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Ship the server and the buf-generated `yfinance_grpc` package side by side,
# so generated code imports as `yfinance_grpc.v1alpha1` with no sys.path setup.
packages = ["src/yfinance_grpc_server", "gen/yfinance_grpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--tb=short", "-m", "not integration"]
markers = [
    "integration: needs a running server on localhost:50059 (run with `-m integration`)",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["gen"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "BLE", "LOG", "G", "PT", "RUF",
]
ignore = [
    "E501",  # line length is the formatter's job; long f-strings stay readable
    "N802",  # gRPC servicer methods are PascalCase by protocol
]

[tool.ruff.lint.isort]
known-first-party = ["yfinance_grpc_server"]
known-third-party = ["yfinance_grpc"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
mypy_path = "gen"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "grpc_reflection.*", "grpc.*"]
ignore_missing_imports = true
